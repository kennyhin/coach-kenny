[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/transcriber/*"
  to = "/.netlify/functions/transcriber"
  status = 200
  force = true

[[headers]]
  for = "/bible-study/transcriber/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
