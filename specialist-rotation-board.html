<style>
  :root{
    /* Dark palette - true black base */
    --bg-0:#000000;             /* deepest background */
    --bg-1:#0B0B0F;             /* mid depth */
    --bg-2:#141419;             /* lifted */
    --card:rgba(24, 24, 28, 0.75);   /* glassy card surface, neutral dark */
    --card-solid:#181820;
    --card-hover:rgba(32, 32, 38, 0.85);
    --line:rgba(255,255,255,0.08);
    --line-strong:rgba(255,255,255,0.14);

    /* Text on dark */
    --ink:#F0F4FA;
    --ink-soft:#C9D2E0;
    --muted:#7B8AA3;
    --muted-strong:#94A3BC;

    /* SLAM brand */
    --slam-red:#E31E24;         /* team red (from logo) */
    --slam-red-soft:#F04E54;
    --slam-green:#4FBE4F;       /* mascot green */
    --slam-green-soft:#6ED26E;

    /* Accents (keep amber for warmth/highlights, add mint) */
    --amber:#F2A93B;
    --mint:#5FD1B0;
    --lilac:#B78CE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 90% 60% at 15% -10%, rgba(227, 30, 36, 0.10), transparent 55%),
      radial-gradient(ellipse 80% 60% at 100% 10%, rgba(60, 100, 180, 0.08), transparent 55%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(60, 90, 150, 0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment:fixed;
    color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .board-header{
    background:linear-gradient(180deg, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.35) 100%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    color:#fff; padding:16px 28px 0;
    border-bottom:1px solid var(--line-strong);
    position:relative;
    overflow:hidden;
  }

  /* Centered stack: brand, toggle, day tiles, date — no empty side gaps */
  .header-bar{
    max-width:640px;
    margin:0 auto;
    padding:2px 0 16px;
    position:relative;
    z-index:1;
  }
  .header-shell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,0.035);
    border:1px solid var(--line-strong);
    border-radius:16px;
    padding:14px 14px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .header-brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px 14px;
    width:fit-content;
    max-width:100%;
    margin:0 auto;
  }
  .board-header .brand-block{
    display:flex; align-items:center; justify-content:center; gap:8px; min-width:0;
  }
  .board-header .brand-mark{
    height:28px; width:auto; flex-shrink:0;
    filter:drop-shadow(0 2px 6px rgba(227, 30, 36, 0.35));
  }
  .board-header .brand-text h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px;
    letter-spacing:0.01em; margin:0; color:#fff; line-height:1.1;
  }
  .board-header .brand-text .eyebrow{ display:none; }

  /* Segmented toggle — recessed track + sliding active pill */
  .mode-switch{
    display:inline-flex; flex-direction:row; gap:2px; width:auto; min-width:280px;
    background:rgba(0,0,0,0.55); padding:4px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .mode-switch button{
    flex:1; padding:9px 10px; border:none; background:transparent;
    color:rgba(255,255,255,0.45); font-family:'Inter',sans-serif; font-weight:700; font-size:12px;
    border-radius:9px; cursor:pointer; white-space:nowrap; text-align:center;
    transition:color .15s ease, background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .mode-switch button:hover:not(.active){
    color:rgba(255,255,255,0.85); background:rgba(255,255,255,0.06);
  }
  .mode-switch button:active:not(.active){ transform:scale(0.97); }
  .mode-switch button.active{
    background:var(--slam-red); color:#fff;
    box-shadow:0 2px 12px rgba(227, 30, 36, 0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .attendance-link{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:39px; padding:8px 13px; border-radius:10px;
    background:rgba(255,255,255,0.08); color:#fff;
    border:1px solid rgba(255,255,255,0.18);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    text-decoration:none; white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .attendance-link:hover{
    background:rgba(227,30,36,0.22); border-color:var(--slam-red);
  }
  .attendance-link:active{ transform:scale(0.97); }
  .attendance-link:focus-visible{
    outline:3px solid rgba(227,30,36,0.45); outline-offset:2px;
  }

  .day-panel{ min-width:0; width:100%; text-align:center; }
  .datebar{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; margin-top:0; flex-wrap:wrap; }
  .datebar label{ display:none; }
  .datebar-controls{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .datebar input[type=date]{ font-family:'IBM Plex Mono',monospace; font-size:13px; background:rgba(255,255,255,0.06); color:#fff; border:1px solid var(--line-strong); padding:7px 10px; border-radius:8px; color-scheme:dark; }
  .datebar input[type=date]:focus{ outline:none; border-color:var(--slam-red); box-shadow:0 0 0 3px rgba(227, 30, 36, 0.2); }
  .datebar button.quick{ font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:#fff; background:var(--slam-red); border:none; padding:7px 12px; border-radius:8px; cursor:pointer; transition:all .15s ease; }
  .datebar button.quick:hover{ background:var(--slam-red-soft); }
  .datebar button.quick.ghost{ background:rgba(255,255,255,0.06); color:var(--ink-soft); border:1px solid var(--line-strong); }
  .datebar button.quick.ghost:hover{ background:rgba(255,255,255,0.1); color:#fff; }
  .updated-stamp{ display:none; }

  .big-banner{ position:relative; z-index:1; width:100%; }
  .big-banner .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    align-items:stretch;
  }
  .big-banner .unit{
    text-align:center;
    padding:12px 10px 10px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background:rgba(0,0,0,0.28);
    min-width:0;
  }
  /* K–2 = rotation DAY (hot red, number-forward) */
  .big-banner .unit.k2-tile{
    border-color:rgba(227,30,36,0.7);
    background:linear-gradient(165deg, rgba(227,30,36,0.42), rgba(120,10,14,0.55) 55%, rgba(0,0,0,0.35));
    box-shadow:0 0 0 1px rgba(227,30,36,0.25), 0 10px 22px rgba(227,30,36,0.2);
  }
  /* 3–5 = weekday (cool slate, word-forward) */
  .big-banner .unit.g35-tile{
    border-color:rgba(148,163,184,0.35);
    background:linear-gradient(165deg, rgba(71,85,105,0.45), rgba(15,23,42,0.65) 55%, rgba(0,0,0,0.35));
    box-shadow:0 0 0 1px rgba(148,163,184,0.12), 0 10px 22px rgba(0,0,0,0.22);
  }
  .big-banner .unit .chip{
    font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.16em; text-transform:uppercase; display:block; margin-bottom:6px; font-weight:700;
  }
  .big-banner .unit.k2-tile .chip{ color:rgba(255,200,200,0.95); }
  .big-banner .unit.g35-tile .chip{ color:rgba(186,198,214,0.9); }
  .big-banner .unit .val{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    color:#fff; letter-spacing:0.02em; line-height:1; display:block;
    white-space:nowrap;
  }
  .big-banner .unit.k2-tile .val{
    font-size:13px; font-weight:700; letter-spacing:0.18em;
    color:rgba(255,255,255,0.7);
  }
  .big-banner .unit.k2-tile .val .day-num{
    display:block; margin-top:4px;
    color:#fff; font-size:44px; letter-spacing:-0.02em; line-height:0.95;
    text-shadow:0 0 24px rgba(227,30,36,0.55);
  }
  .big-banner .unit.g35-tile .val{
    font-size:18px; letter-spacing:0.08em; color:#e8eef7; margin-top:6px;
    font-weight:700;
  }
  .big-banner .weekday-strip{
    display:flex; justify-content:center; gap:4px; margin:2px 0 2px;
  }
  .big-banner .weekday-strip span{
    width:28px; height:28px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700;
    color:rgba(255,255,255,0.35); background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.08);
  }
  .big-banner .weekday-strip span.on{
    color:#0b1220; background:#e8eef7;
    border-color:rgba(255,255,255,0.4);
    box-shadow:0 0 14px rgba(226,232,240,0.35);
  }
  .big-banner .unit .val .accent{ color:var(--slam-red-soft); }
  .big-banner.noschool .row{ grid-template-columns:1fr; }
  .big-banner.noschool .unit{
    border-color:rgba(245,158,11,0.45);
    background:linear-gradient(180deg, rgba(245,158,11,0.12), rgba(0,0,0,0.25));
  }
  .big-banner.noschool .unit + .unit{ border-left:none; }
  .big-banner.noschool .chip{ color:var(--amber); }
  .big-banner.noschool .val{ color:var(--amber); font-size:15px; line-height:1.3; white-space:normal; margin-top:0; letter-spacing:0.01em; }
  .big-banner .datestr{ display:none; }

  .layout{ display:flex; align-items:flex-start; max-width:1200px; margin:0 auto; }
  nav.rail{
    width:230px; flex-shrink:0; padding:18px 12px; position:sticky; top:0;
  }
  nav.rail.hidden{ display:none; }
  nav.rail .rail-group{
    display:flex; flex-direction:column; gap:3px;
    background:rgba(0,0,0,0.55); padding:6px; border-radius:14px;
    border:1px solid rgba(255,255,255,0.16);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03);
  }
  nav.rail button.flat{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:11px 12px; border-radius:10px;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600; color:rgba(255,255,255,0.55);
    cursor:pointer; transition:all .15s ease;
  }
  nav.rail button.flat:hover{ background:rgba(255,255,255,0.06); color:#fff; border-color:rgba(255,255,255,0.06); }
  nav.rail button.flat:active{ transform:scale(0.98); }
  nav.rail button.flat.active{
    background:var(--slam-red); color:#fff; border-color:rgba(255,255,255,0.12);
    box-shadow:0 2px 12px rgba(227, 30, 36, 0.4), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  nav.rail button.flat .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,0.2); }
  nav.rail button.flat.active .dot{ border-color:rgba(255,255,255,0.65); background:rgba(255,255,255,0.25); }
  nav.rail .rail-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); padding:0 8px; margin:14px 0 6px; font-weight:600; }

  /* accordion (teacher nav) — recessed track so it reads as toggleable */
  nav.rail .rail-group.teacher-rail{ gap:4px; }
  .grade-group{ margin-bottom:0; }
  .grade-group .grade-head{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:transparent; border:1px solid transparent; padding:10px 12px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; color:rgba(255,255,255,0.7);
    cursor:pointer; border-radius:10px; transition:all .15s ease;
  }
  .grade-group .grade-head:hover{ background:rgba(255,255,255,0.06); color:#fff; border-color:rgba(255,255,255,0.06); }
  .grade-group.open .grade-head{ color:#fff; background:rgba(255,255,255,0.05); }
  .grade-group .grade-head .chev{ transition:transform .15s ease; font-size:11px; color:var(--muted); }
  .grade-group.open .grade-head .chev{ transform:rotate(90deg); color:var(--slam-red-soft); }
  .grade-group .teacher-list{ display:none; padding:2px 2px 4px; }
  .grade-group.open .teacher-list{ display:flex; flex-direction:column; gap:2px; }
  .grade-group .teacher-list button{
    width:100%; text-align:left; background:transparent; border:1px solid transparent;
    padding:8px 12px 8px 22px; font-size:13px; color:rgba(255,255,255,0.5);
    border-radius:8px; cursor:pointer; transition:all .15s ease;
  }
  .grade-group .teacher-list button:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .grade-group .teacher-list button.active{
    background:var(--slam-red); color:#fff; border-color:rgba(255,255,255,0.12);
    box-shadow:0 2px 10px rgba(227,30,36,0.35);
  }

  main{ flex:1; padding:26px 28px 60px; min-width:0; }
  main.full{ padding:26px 28px 60px; }

  .intro-copy{ color:var(--muted-strong); font-size:14.5px; max-width:660px; line-height:1.55; margin-bottom:22px;}
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
  .card{
    background:var(--card);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-left:4px solid var(--accent,#999);
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    transition:all .18s ease;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    position:relative; overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(135deg, transparent 60%, var(--accent, transparent));
    opacity:0.06; pointer-events:none;
  }
  .card:hover{ transform:translateY(-3px); background:var(--card-hover); border-color:var(--line-strong); box-shadow:0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px var(--accent, transparent); }
  .card h3{ margin:0 0 4px; font-family:'Space Grotesk',sans-serif; font-size:17px; color:#fff; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .card .subj{ font-size:13px; color:var(--muted-strong); }
  .card .card-avatar{ width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid var(--accent,#999); box-shadow:0 2px 8px rgba(0,0,0,0.3); position:relative; z-index:1; }

  .page-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
  .page-head .swatch{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  .page-head h2{ font-family:'Space Grotesk',sans-serif; font-size:26px; margin:0; color:#fff; letter-spacing:0.01em; }
  .page-head .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; padding:4px 10px; border-radius:6px; font-weight:600; background:rgba(255,255,255,0.05); border:1px solid currentColor; }
  .page-sub{ color:var(--muted-strong); font-size:14px; margin:0 0 18px; }

  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted-strong); margin:28px 0 12px; display:flex; align-items:center; gap:12px; font-weight:600; }
  .section-label::before{ content:""; width:16px; height:2px; background:var(--slam-red); border-radius:1px; }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--line); }

  table.board{ width:100%; border-collapse:collapse; background:var(--card); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:12px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.2); margin-bottom:6px; border:1px solid var(--line); }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:6px; border-radius:12px; }
  .table-scroll table.board{ margin-bottom:0; }
  table.board th{ background:rgba(0, 0, 0, 0.5); color:var(--slam-red-soft); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11.5px; text-align:left; padding:12px 14px; letter-spacing:0.06em; text-transform:uppercase; border-bottom:1px solid var(--line-strong); }
  table.board .t{ display:block; color:var(--muted-strong); font-size:10.5px; margin-top:3px; font-weight:500; text-transform:none; letter-spacing:0;}
  table.board td .t{ color:var(--muted); }
  table.board td{ padding:12px 14px; border-bottom:1px solid var(--line); font-size:14.5px; color:var(--ink); }
  table.board td.daycol{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:#fff; white-space:nowrap; }
  table.board tr:last-child td{ border-bottom:none; }
  table.board tr.hl{ background:rgba(227, 30, 36, 0.08); box-shadow:inset 3px 0 0 var(--slam-red); }
  table.board tr.hl td.daycol{ color:var(--slam-red-soft); }
  table.board tr.off td{ color:var(--muted); font-style:italic; }
  table.board td.empty{ color:var(--muted); font-style:italic; }

  .note{ font-size:13px; color:var(--ink-soft); background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin:10px 0 0; line-height:1.5; }
  .note strong{ color:#fff; }

  .print-btn{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; background:var(--slam-red); color:#fff; border:none; padding:9px 16px; border-radius:8px; cursor:pointer; margin-top:24px; transition:all .15s ease; box-shadow:0 2px 10px rgba(227,30,36,0.3); }
  .print-btn:hover{ background:var(--slam-red-soft); transform:translateY(-1px); box-shadow:0 4px 14px rgba(227,30,36,0.4); }

  /* Today callout (teacher page) */
  .today-callout{ background:var(--card); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-left:5px solid var(--callout-color, var(--slam-red)); border-radius:14px; padding:18px 20px; margin-bottom:26px; display:flex; align-items:center; justify-content:space-between; gap:16px; box-shadow:0 4px 16px rgba(0,0,0,0.2); }
  .today-callout .lbl{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--muted-strong); letter-spacing:0.12em; font-weight:600; }
  .today-callout .big{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-top:6px; letter-spacing:0.01em; }
  .today-callout .time{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted-strong); margin-top:4px; }
  .today-callout .callout-avatar{ width:60px; height:60px; border-radius:50%; object-fit:cover; flex-shrink:0; border:2px solid var(--callout-color, var(--slam-red)); }
  .today-callout .avatar-group{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .callout-bubble{
    position:relative; background:var(--callout-color, var(--slam-red)); color:var(--bg-0);
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; line-height:1.35;
    padding:9px 13px; border-radius:14px; max-width:170px; flex-shrink:0;
  }
  .callout-bubble::after{
    content:""; position:absolute; right:-6px; top:50%; transform:translateY(-50%);
    border-width:6px 0 6px 7px; border-style:solid;
    border-color:transparent transparent transparent var(--callout-color, var(--slam-red));
  }
  .today-callout.off{ --callout-color:var(--amber); }
  .today-callout.off .big{ color:var(--amber); font-size:17px; }

  /* glance hero */
  .glance-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:8px; }
  .glance-card{ background:var(--card); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.2); transition:all .18s ease; }
  .glance-card:hover{ border-color:var(--line-strong); transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,0.28); }
  .glance-card h4{ margin:0; background:linear-gradient(135deg, rgba(227,30,36,0.15), rgba(227,30,36,0.05)); color:#fff; font-family:'Space Grotesk',sans-serif; font-size:14.5px; padding:11px 15px; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--line); }
  .glance-card h4 .gt{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted-strong); font-weight:500; letter-spacing:0.06em; }
  .glance-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 15px; border-bottom:1px solid var(--line); font-size:13.5px; gap:8px;}
  .glance-row:last-child{ border-bottom:none; }
  .glance-row .who{ color:var(--muted-strong); font-size:12.5px; }
  .glance-row .what{ font-weight:600; text-align:right; }
  .subj-chip{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:0.04em; padding:2px 5px; border-radius:4px; border:1px solid currentColor; margin-right:7px; vertical-align:middle; opacity:0.9; }
  .duty-badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap;
    color:#0b1220; background:var(--amber);
    border-radius:999px; padding:3px 8px; margin-left:7px; vertical-align:middle;
    box-shadow:0 0 12px rgba(242,169,59,0.35);
  }
  .duty-strip{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px 10px;
    background:rgba(242,169,59,0.10); border:1px solid rgba(242,169,59,0.35);
    border-radius:12px; padding:10px 14px; margin:0 0 18px;
  }
  .duty-strip.off{
    background:rgba(255,255,255,0.03); border-color:var(--line);
  }
  .duty-strip-label{
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--amber);
  }
  .duty-strip.off .duty-strip-label{ color:var(--muted-strong); }
  .duty-strip-photos{ display:flex; align-items:center; gap:8px; }
  .duty-strip-photo{
    width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--amber); box-shadow:0 0 12px rgba(242,169,59,0.4);
    background:#111;
  }
  .duty-strip.off .duty-strip-who{ color:var(--muted-strong); font-weight:600; font-size:14px; }
  .card h3 .duty-badge{ margin-left:0; }
  .page-head .duty-badge{ margin-left:0; }
  nav.rail button.flat .duty-badge,
  .mobile-tabs button .duty-badge{
    margin-left:auto; font-size:9px; padding:2px 6px; box-shadow:none;
  }
  nav.rail button.flat.active .duty-badge,
  .mobile-tabs button.active .duty-badge{
    background:#fff; color:var(--slam-red);
  }
  .glance-empty{ padding:18px; color:var(--muted); font-size:13.5px; font-style:italic; text-align:center; }
  .placeholder-box{ background:var(--card); border:1px dashed var(--line-strong); border-radius:14px; padding:36px; text-align:center; color:var(--muted-strong); font-size:14px; }

  .mobile-tabs{ display:none; }
  .mobile-nav-alt{ display:none; }

  @media (max-width:860px){

    nav.rail{ display:none; }

    .mobile-tabs button{ flex-shrink:0; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:#fff; background:rgba(255,255,255,0.06); border:1px solid var(--line-strong); padding:8px 13px; border-radius:20px; display:flex; align-items:center; gap:7px; cursor:pointer; }
    .mobile-tabs button.active{ background:var(--slam-red); color:#fff; border-color:var(--slam-red); }
    .mobile-tabs .dot{ width:8px;height:8px;border-radius:50%; }

    .mobile-nav-alt .grade-group .grade-head{ color:#fff; }
    .mobile-nav-alt .grade-group .grade-head:hover{ background:rgba(255,255,255,0.08); }
    .mobile-nav-alt .grade-group .teacher-list button{ color:#fff; }
    .mobile-nav-alt .grade-group .teacher-list button:hover{ background:rgba(255,255,255,0.08); }
    .mobile-nav-alt .grade-group .teacher-list button.active{ background:var(--slam-red); color:#fff; }
    .mode-switch{ width:100%; max-width:100%; min-width:0; }
    .mode-switch button{ padding:10px 8px; font-size:11.5px; }
    .attendance-link{ width:100%; min-height:44px; }
    .header-brand-row{ flex-direction:column; gap:10px; }

    .board-header::before{ width:160px; height:180px; right:-60px; opacity:0.05; }
    .board-header .brand-mark{ height:26px; }
    .board-header .brand-text h1{ font-size:13px; }

    .header-shell{
      gap:10px;
      padding:12px;
      width:100%;
      box-sizing:border-box;
    }
    .day-panel, .datebar, .big-banner{ width:100%; text-align:center; }
    .datebar-controls{ width:100%; justify-content:center; }
    .big-banner .row{ gap:6px; }
    .big-banner .unit{ padding:10px 6px 9px; }
    .big-banner .unit.k2-tile .val{ font-size:11px; letter-spacing:0.14em; }
    .big-banner .unit.k2-tile .val .day-num{ font-size:36px; }
    .big-banner .unit.g35-tile .val{ font-size:14px; letter-spacing:0.04em; margin-top:4px; }
    .big-banner .weekday-strip span{ width:24px; height:24px; font-size:10px; }
    .big-banner.noschool .val{ white-space:normal; font-size:14px; line-height:1.3; }
    .mobile-tabs.show-mode{ justify-content:center; }
    .print-all-bar{ justify-content:center; text-align:center; }

    .section-label{ justify-content:center; text-align:center; }
    .section-label::before,
    .section-label::after{ flex:1; width:auto; height:1px; background:var(--line); }

    .glance-grid{ justify-items:stretch; }
    .duty-badge{ font-size:11px; padding:4px 9px; }
    .duty-strip{ margin:0 auto 16px; text-align:center; }

  .print-all-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:32px; padding-top:20px; border-top:1px solid var(--line); }
  .print-all-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted-strong); font-weight:600; }
  .print-btn.ghost-btn{ background:rgba(255,255,255,0.06); color:var(--ink-soft); border:1px solid var(--line-strong); box-shadow:none; }
  .print-btn.ghost-btn:hover{ background:rgba(255,255,255,0.1); color:#fff; }

  @media print{
    body{ background:#fff !important; color:#000; }
    body::before, .board-header, nav.rail, .mobile-tabs, .mobile-nav-alt, .print-btn, .print-all-bar, .daypicker, .datebar, .mode-switch, .attendance-link{ display:none !important; }
    main{ padding:0; }
    .page-head h2, .today-callout .big, .card h3, .glance-card h4{ color:#000 !important; }
    .today-callout, table.board, .glance-card, .note{ background:#fff !important; color:#000 !important; border-color:#ccc !important; box-shadow:none !important; }
    table.board th{ background:#eee !important; color:#000 !important; -webkit-print-color-adjust:exact; }
    table.board td{ color:#000 !important; }
    .subj-chip{ border-color:#999 !important; }
    .duty-badge{ background:#f2a93b !important; color:#000 !important; box-shadow:none !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .duty-strip{ background:#fff8e8 !important; border-color:#e0b45a !important; }
    .duty-strip-label, .duty-strip-who{ color:#000 !important; }

  }

function resolveSpecialist(code, band, weekdayFull){
  if(code==="SF") return { id:"theo", name:"Coach Theo", color:SPECIALIST_COLORS.theo };
  if(code==="MUSIC") return { id:"matthew", name:"Mr. Matthew", color:SPECIALIST_COLORS.matthew };
  if(code==="SCIENCE") return { id:"ccasipong", name:"Ms. C. Casipong", color:SPECIALIST_COLORS.ccasipong };
  if(code==="STEAM"){
    return band==="k2" ? { id:"marc", name:"Coach Marc", color:SPECIALIST_COLORS.marc }
                        : { id:"lharris", name:"Mrs. L. Harris", color:SPECIALIST_COLORS.lharris };
  }
  if(code==="PE"){
    if(band==="g35" && weekdayFull==="Thursday") return { id:"marc", name:"Coach Marc", color:SPECIALIST_COLORS.marc };
    return { id:"coachk", name:"Coach K", color:SPECIALIST_COLORS.coachk };
  }
  return { id:"", name:"—", color:"#999" };
}

/* ============================== DATE HELPERS ============================== */
function parseISO(s){ const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd); }
function toISO(dt){ const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,'0'), dd=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function fmtLong(dt){ return dt.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function calFor(dt){
  const iso = toISO(dt);
  const row = CALENDAR[iso];
  if(!row) return { dow3:"", school:false, k2day:null, note:"Outside calendar range" };
  return { dow3:row[0], school:row[1], k2day:row[2], note:row[3] };
}
function getWeekDates(dt){
  const dow = dt.getDay();
  const offset = dow===0 ? 1 : (1-dow);
  const monday = new Date(dt); monday.setDate(dt.getDate()+offset);
  const out=[];
  for(let i=0;i<5;i++){ const d2=new Date(monday); d2.setDate(monday.getDate()+i); out.push(d2); }
  return out;
}
const DOW3_TO_FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

/* Crosswalk duty: alternate pairs every weekday.
   After Marc covered for Matthew on Fri Aug 21, the pairs flipped:
   Pair A = Matthew + Casipong, Pair B = Marc + Theo.
   Aug 20, 2026 (Thu) is still the even/odd start, so Mon 8/24 = Pair A. */
const CROSSWALK_START = parseISO("2026-08-20");
const CROSSWALK_PAIR_A = [
  { id:"matthew", name:"Mr. Matthew" },
  { id:"ccasipong", name:"Ms. C. Casipong" }
];
const CROSSWALK_PAIR_B = [
  { id:"marc", name:"Coach Marc" },
  { id:"theo", name:"Coach Theo" }
];

function isWeekendDate(dt){
  const d = dt.getDay();
  return d===0 || d===6;
}
function daysBetween(a, b){
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function weekdayOffsetFromStart(dt){
  const days = daysBetween(CROSSWALK_START, dt);
  const startDow = CROSSWALK_START.getDay(); // Thursday = 4
  let n = 0;
  if(days >= 0){
    for(let i=0;i<days;i++){
      const dow = (startDow + i + 1) % 7;
      if(dow!==0 && dow!==6) n++;
    }
  } else {
    for(let i=0;i<-days;i++){
      const dow = ((startDow - i - 1) % 7 + 7) % 7;
      if(dow!==0 && dow!==6) n--;
    }
  }
  return n;
}
function onDutyPair(dt){
  if(isWeekendDate(dt)) return [];
  const offset = weekdayOffsetFromStart(dt);
  return ((offset % 2) + 2) % 2 === 0 ? CROSSWALK_PAIR_A : CROSSWALK_PAIR_B;
}
function dutyStripHtml(dt){
  const pair = onDutyPair(dt);
  if(!pair.length){
    return `<div class="duty-strip off"><span class="duty-strip-label">Duty:</span><span class="duty-strip-who">None on weekends</span></div>`;
  }
  const photos = pair.map(p=>`<img class="duty-strip-photo" src="${PHOTO_DATA[p.id]}" alt="${p.name}" title="${p.name}">`).join("");
  return `<div class="duty-strip"><span class="duty-strip-label">Duty:</span><span class="duty-strip-photos">${photos}</span></div>`;
}

function renderRail(){
  const rail = document.getElementById('rail');
  const mobileTabs = document.getElementById('mobileTabs');
  const mobileAlt = document.getElementById('mobileNavAlt');

  // Each nav slot only ever appears in ONE place at a time: the desktop rail
  // shows via plain CSS above 860px; the mobile-only alternatives are gated
  // by BOTH the "show-mode" class (this function) AND the media query
  // (styles.css) - so a slot never renders unless both agree.
  mobileTabs.classList.remove('show-mode');
  mobileAlt.classList.remove('show-mode');

  if(mode==="glance"){
    rail.className = "rail hidden";
    rail.innerHTML = "";
    return;
  }

  if(mode==="specialist"){
    rail.className = "rail";
    let railHtml = `<div class="rail-label">Specialists</div><div class="rail-group">
      <button class="flat ${activeSpecialistId===null?'active':''}" data-id="__all__"><span class="dot" style="background:#fff"></span>All specialists</button>`;
    let mobileHtml = `<button data-id="__all__" class="${activeSpecialistId===null?'active':''}"><span class="dot" style="background:#E31E24"></span>Overview</button>`;
    specialists.forEach(s=>{
      const on = activeSpecialistId===s.id;
      railHtml += `<button class="flat ${on?'active':''}" data-id="${s.id}"><span class="dot" style="background:${s.color}"></span>${s.name}</button>`;
      mobileHtml += `<button data-id="${s.id}" class="${on?'active':''}"><span class="dot" style="background:${s.color}"></span>${s.name}</button>`;
    });
    railHtml += `</div>`;
    rail.innerHTML = railHtml;
    mobileTabs.innerHTML = mobileHtml;
    mobileTabs.classList.add('show-mode');
    [...rail.querySelectorAll('button'), ...mobileTabs.querySelectorAll('button')].forEach(b=>{
      b.addEventListener('click', ()=>{ activeSpecialistId = b.dataset.id==="__all__" ? null : b.dataset.id; syncHash(); renderRail(); renderMain(); window.scrollTo({top:0,behavior:'smooth'}); });
    });
    return;
  }

  if(mode==="teacher"){
    rail.className = "rail";
    rail.innerHTML = buildAccordionHtml();

function buildAccordionHtml(){

function wireAccordion(container){

/* ============================== DEEP LINKING (URL hash) ============================== */
// Keeps the URL in sync with the current view so pages can be bookmarked/shared.
// Format examples:  #glance  |  #specialist/theo  |  #teacher/Molinari
let suppressHashWrite = false;
function syncHash(){
  if(suppressHashWrite) return;
  let h = mode;
  if(mode==="specialist" && activeSpecialistId) h += "/" + activeSpecialistId;
  if(mode==="teacher" && activeTeacherIdx!==null) h += "/" + encodeURIComponent(TEACHERS[activeTeacherIdx].name);
  const newHash = "#" + h;
  if(("#"+ (location.hash.slice(1))) !== newHash){
    history.replaceState(null, "", newHash);
  }
}
function applyHash(){
  const raw = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  if(!raw) return false;
  const [m, arg] = raw.split("/");
  if(!["glance","specialist","teacher"].includes(m)) return false;
  mode = m;
  activeSpecialistId = null;
  activeTeacherIdx = null;
  if(m==="specialist" && arg){
    if(specialists.some(s=>s.id===arg)) activeSpecialistId = arg;
  }
  if(m==="teacher" && arg){
    const idx = TEACHERS.findIndex(t=>t.name===arg);
    if(idx>=0){
      activeTeacherIdx = idx;
      openGrades.add(TEACHERS[idx].gradeKey); // expand that teacher's grade group
    }
  }
  return true;
}

/* ============================== PDF GENERATION ==============================
   Builds real, downloadable .pdf files entirely in the browser using jsPDF +
   jspdf-autotable (loaded via script tags in the page head). This replaces
   window.print(), which embedding platforms like Google Sites block from
   being triggered by page scripts. */
function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
const PDF_NAVY = [16, 27, 43];

// ---- plain-data table builders (shared by single-page and packet PDFs) ----
function k2TableData(rows){
  return { head:['Day','Kindergarten','1st Grade','2nd Grade'],
           body: rows.map(r=>[`Day ${r.day}`, r.kinder, r.first, r.second]) };
}
function g35TableData(rows){
  return { head:['Day','3rd Grade','4th Grade','5th Grade'],
           body: rows.map(r=>[r.day, r.third===null?'—':r.third, r.fourth===null?'—':r.fourth, r.fifth===null?'—':r.fifth]) };
}
function fullDayTableData(s){
  const info = calFor(selectedDate);
  if(!info.school) return null;
  const weekdayFull = DOW3_TO_FULL[info.dow3];
  const g35Row = s.g35 ? s.g35.find(r=>r.day===weekdayFull) : null;
  const k2Row = s.k2 ? s.k2.find(r=>r.day===info.k2day) : null;
  const entries = [
    [G35_TIMES.third,  '3rd Grade',   g35Row ? g35Row.third  : null],
    [G35_TIMES.fourth, '4th Grade',   g35Row ? g35Row.fourth : null],
    [G35_TIMES.fifth,  '5th Grade',   g35Row ? g35Row.fifth  : null],
    [K2_TIMES.kinder,  'Kindergarten',k2Row  ? k2Row.kinder  : null],
    [K2_TIMES.first,   '1st Grade',   k2Row  ? k2Row.first   : null],
    [K2_TIMES.second,  '2nd Grade',   k2Row  ? k2Row.second  : null]
  ];
  return { head:['Time','Grade','Class'], body: entries.map(([t,g,c])=>[t,g,c===null?'No class':c]) };
}
function teacherWeekTableData(t){
  const week = getWeekDates(selectedDate);
  const body = week.map(d=>{
    const info = calFor(d);
    const label = `${DOW3_TO_FULL[info.dow3] || d.toLocaleDateString('en-US',{weekday:'long'})} (${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})})`;
    if(!info.school) return [label, `No School — ${info.note||'—'}`];
    const weekdayFull = DOW3_TO_FULL[info.dow3];
    const pattern = t.band==="k2" ? K2_PATTERNS[t.position] : G35_PATTERNS[t.position];
    const code = t.band==="k2" ? pattern[info.k2day-1] : pattern[WEEKDAYS.indexOf(weekdayFull)];
    const spec = resolveSpecialist(code, t.band, weekdayFull);
    const tag = t.band==="k2" ? ` (Day ${info.k2day})` : '';
    return [label, `${SUBJECT_META[code].abbr} — ${SUBJECT_META[code].label} — ${spec.name}${tag}`];
  });
  return { head:['Day','Special'], body };
}
function teacherPatternTableData(t){
  if(t.band==="k2"){
    const body = K2_PATTERNS[t.position].map((code,i)=>{
      const spec = resolveSpecialist(code, "k2", null);
      return [`Day ${i+1}`, `${SUBJECT_META[code].abbr} — ${SUBJECT_META[code].label} — ${spec.name}`];
    });
    return { head:['Day','Special'], body };
  }
  const body = G35_PATTERNS[t.position].map((code,i)=>{
    const weekdayFull = WEEKDAYS[i];
    const spec = resolveSpecialist(code, "g35", weekdayFull);
    return [weekdayFull, `${SUBJECT_META[code].abbr} — ${SUBJECT_META[code].label} — ${spec.name}`];
  });
  return { head:['Day','Special'], body };
}

// ---- shared low-level PDF helpers ----
function pdfCheckPageBreak(doc, y, threshold){
  if(y > (threshold || 250)){ doc.addPage(); return 18; }
  return y;
}
function pdfSectionTitle(doc, y, text, size){
  doc.setFont('helvetica','bold'); doc.setFontSize(size || 11); doc.setTextColor(20,20,20);
  doc.text(text, 14, y);
  return y + 5;
}
function pdfDrawTable(doc, y, data, accentRgb, fontSize){
  doc.autoTable({
    startY: y, head:[data.head], body: data.body, theme:'grid',
    styles:{ fontSize: fontSize || 9, cellPadding: 2.6, textColor:[30,30,30] },
    headStyles:{ fillColor: accentRgb, textColor:[255,255,255], fontStyle:'bold' },
    margin:{ left:14, right:14 }
  });
  return doc.lastAutoTable.finalY + 8;
}

// ---- single-page downloads ----
function downloadSpecialistPDF(s){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const info = calFor(selectedDate);
  let y = 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20,20,20);
  doc.text(`${s.name} — ${s.subject}`, 14, y); y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(100,100,100);
  doc.text(`${fmtLong(selectedDate)}${info.school ? ` · ${DOW3_TO_FULL[info.dow3]} · K–2 Day ${info.k2day}` : ' · No School'}`, 14, y); y += 8;
  const accent = hexToRgb(s.color);

  if(s.k2 && s.g35){
    const fd = fullDayTableData(s);
    if(fd){ y = pdfSectionTitle(doc, y, 'Full Day, In Order'); y = pdfDrawTable(doc, y, fd, accent) + 2; }
  }
  if(s.k2){
    y = pdfCheckPageBreak(doc, y);
    y = pdfSectionTitle(doc, y, 'K–2 · 8-Day Rotation');
    y = pdfDrawTable(doc, y, k2TableData(s.k2), accent) + 2;
  }
  if(s.g35){
    y = pdfCheckPageBreak(doc, y);
    y = pdfSectionTitle(doc, y, '3rd–5th · Weekly');
    y = pdfDrawTable(doc, y, g35TableData(s.g35), accent);
    if(s.g35note){
      doc.setFont('helvetica','italic'); doc.setFontSize(8.5); doc.setTextColor(120,120,120);
      doc.text(doc.splitTextToSize(s.g35note, 180), 14, y);
    }
  }
  doc.save(`${s.name.replace(/[^a-z0-9]/gi,'_')}_schedule.pdf`);
}
function downloadTeacherPDF(t){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 18;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20,20,20);
  doc.text(`${t.name} — ${GRADE_LABELS[t.gradeKey]}`, 14, y); y += 7;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(100,100,100);
  doc.text(t.band==="k2" ? "K–2 · 8-Day Rotation" : "3rd–5th · Weekly (Mon–Fri)", 14, y); y += 8;

  y = pdfSectionTitle(doc, y, 'This Week');
  y = pdfDrawTable(doc, y, teacherWeekTableData(t), PDF_NAVY) + 2;

  if(t.band==="k2"){
    y = pdfCheckPageBreak(doc, y, 240);
    y = pdfSectionTitle(doc, y, 'Full Rotation Pattern (reference)');
    pdfDrawTable(doc, y, teacherPatternTableData(t), PDF_NAVY);
  }
  doc.save(`${t.name.replace(/[^a-z0-9]/gi,'_')}_schedule.pdf`);
}
function downloadCurrentSpecialistPDF(){
  const s = specialists.find(x=>x.id===activeSpecialistId);
  if(s) downloadSpecialistPDF(s);
}
function downloadCurrentTeacherPDF(){
  if(activeTeacherIdx!==null) downloadTeacherPDF(TEACHERS[activeTeacherIdx]);
}

// ---- full packet download (all specialists, or all teachers by grade) ----
function downloadPacketPDF(grouping){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const info = calFor(selectedDate);
  const dateLine = fmtLong(selectedDate) + (info.school
      ? ` · ${DOW3_TO_FULL[info.dow3]} · K–2 Day ${info.k2day}`
      : ` · ${info.note || 'No School'}`);

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20,20,20);
  doc.text('SLAM Nevada — Specialist Rotation', 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(100,100,100);
  doc.text(`${grouping==='specialist' ? 'By Specialist' : 'By Teacher'} · ${dateLine} · Generated ${BUILD_DATE}`, 14, 25);
  let y = 34;

  if(grouping==='specialist'){
    specialists.forEach(s=>{
      y = pdfCheckPageBreak(doc, y);
      y = pdfSectionTitle(doc, y, `${s.name} — ${s.subject}`, 13);
      const accent = hexToRgb(s.color);
      if(s.k2 && s.g35){
        const fd = fullDayTableData(s);
        if(fd){ y = pdfDrawTable(doc, y, fd, accent, 8) - 2; }
      }
      if(s.k2){ y = pdfCheckPageBreak(doc, y); y = pdfDrawTable(doc, y, k2TableData(s.k2), accent, 8) - 2; }
      if(s.g35){ y = pdfCheckPageBreak(doc, y); y = pdfDrawTable(doc, y, g35TableData(s.g35), accent, 8) + 4; }
    });
  } else {
    GRADE_ORDER.forEach(gk=>{
      const list = TEACHERS.filter(t=>t.gradeKey===gk);
      y = pdfCheckPageBreak(doc, y, 240);
      y = pdfSectionTitle(doc, y, GRADE_LABELS[gk], 14);
      list.forEach(t=>{
        y = pdfCheckPageBreak(doc, y);
        y = pdfSectionTitle(doc, y, t.name, 11);
        y = pdfDrawTable(doc, y, teacherWeekTableData(t), PDF_NAVY, 8);
      });
    });
  }
  doc.save(`SLAM_Rotation_${grouping}_packet.pdf`);
}

/* ============================== MAIN RENDER DISPATCH ============================== */
function renderMain(){
  const main = document.getElementById('main');
  main.className = mode==="glance" ? "full" : "";
  if(mode==="glance"){
    main.innerHTML = glanceHtml();
    const pbs = document.getElementById('printBySpecialist');
    const pbt = document.getElementById('printByTeacher');
    if(pbs) pbs.addEventListener('click', ()=>downloadPacketPDF('specialist'));
    if(pbt) pbt.addEventListener('click', ()=>downloadPacketPDF('teacher'));
  }
  else if(mode==="specialist"){ renderSpecialistMain(); }
  else if(mode==="teacher"){ renderTeacherMain(); }
}

function renderAll(){
  renderModeSwitch();
  renderRail();
  renderBanner();
  renderMain();
}

renderAll();
