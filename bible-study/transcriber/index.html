<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bible-study/assets/bs.css">
<link rel="stylesheet" href="/bible-study/transcriber/transcriber.css">
<title>Transcriber | Coach Kenny</title>
</head>
<body class="ck">
<div class="ck-bar">
  <a class="ck-brand" href="/">Coach <span>Kenny</span></a>
  <button type="button" class="lock-btn" id="lock-btn" hidden>Lock</button>
</div>

<div class="gate" id="gate">
  <form class="gate-card" id="gate-form">
    <p class="eyebrow">Private</p>
    <h1 class="title">Trans<span>criber</span></h1>
    <label class="sr" for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN" required>
    <button type="submit" id="unlock">Unlock</button>
    <p id="gate-msg" role="alert"></p>
  </form>
</div>

<main class="wrap app" id="app" hidden>
  <p class="eyebrow">Private · Bible study</p>
  <h1 class="title">Trans<span>criber</span></h1>
  <p class="note" id="browser-note" hidden></p>

  <label class="field" for="title">Title
    <input id="title" type="text" maxlength="180" placeholder="Gene Kim - Genesis 3" autocomplete="off">
  </label>

  <button type="button" class="listen" id="listen" aria-pressed="false">Start</button>
  <p class="status" id="status" role="status">Ready.</p>
  <div class="meta">
    <span id="timer">0:00</span>
    <span class="meter" aria-hidden="true"><span id="meter-bar"></span></span>
    <span id="words">0 words</span>
  </div>
  <p class="live" id="live" aria-live="polite"></p>

  <label class="field" for="transcript">Transcript
    <textarea id="transcript" spellcheck="true"></textarea>
  </label>
  <p class="autosave" id="autosave"></p>

  <div class="actions">
    <button type="button" class="primary" id="save">Save</button>
    <button type="button" id="copy">Copy</button>
    <button type="button" id="download">Download .txt</button>
    <button type="button" id="clear">Clear</button>
  </div>
  <p class="status" id="save-msg" role="status"></p>
</main>

<video id="sink" class="sink" playsinline muted></video>
<script type="module" src="/bible-study/transcriber/transcriber.js"></script>
</body>
</html>
