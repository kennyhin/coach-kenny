<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1452 792" width="1452" height="792" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Android Chrome: add the specialist schedule to the Home screen in four taps</title>

  <defs>
    <clipPath id="ascreen"><rect x="14" y="14" width="292" height="584" rx="22"/></clipPath>

    <!-- Chrome overflow menu: three stacked dots -->
    <g id="kebab" fill="#E5E7EB">
      <circle cx="0" cy="-9" r="2.9"/>
      <circle cx="0" cy="0" r="2.9"/>
      <circle cx="0" cy="9" r="2.9"/>
    </g>

    <g id="aring">
      <circle r="34" fill="none" stroke="#F0B429" stroke-width="5"/>
      <circle r="34" fill="#F0B429" opacity="0.14"/>
    </g>
  </defs>

  <rect width="1452" height="792" fill="#FFFFFF"/>

  <!-- ============================ STEP 1 ============================ -->
  <g transform="translate(32 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Open it in Chrome</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Tap the three-dot menu, top right</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="36" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="22" fill="#111827"/>
      <g clip-path="url(#ascreen)">
        <rect x="14" y="14" width="292" height="60" fill="#202124"/>
        <rect x="34" y="30" width="212" height="28" rx="14" fill="#303134"/>
        <text x="50" y="49" font-size="14" fill="#BDC1C6">coachkenny.org</text>
        <g transform="translate(280 44)"><use href="#kebab"/></g>

        <text x="160" y="140" text-anchor="middle" font-size="30" font-weight="800"><tspan fill="#FFFFFF">COACH</tspan><tspan fill="#38BDF8">KENNY</tspan></text>
        <g fill="#1C222C">
          <rect x="38" y="178" width="244" height="88" rx="14"/>
          <rect x="38" y="280" width="244" height="88" rx="14"/>
          <rect x="38" y="382" width="244" height="88" rx="14"/>
        </g>
        <g text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">
          <text x="160" y="230">ATHLETICS OS</text>
          <text x="160" y="332">PE GAMES</text>
          <text x="160" y="434">SPECIALIST CALENDAR</text>
        </g>
      </g>
      <use href="#aring" x="280" y="44"/>
    </g>
  </g>

  <!-- ============================ STEP 2 ============================ -->
  <g transform="translate(388 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Add to Home screen</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Some versions say <tspan font-weight="700" fill="#0A0C12">Install app</tspan></text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="36" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="22" fill="#111827"/>
      <g clip-path="url(#ascreen)">
        <rect x="14" y="14" width="292" height="584" fill="#111827"/>
        <!-- dropdown menu anchored top-right -->
        <rect x="118" y="30" width="184" height="420" rx="10" fill="#292A2D"/>
        <g font-size="15" fill="#E8EAED">
          <text x="138" y="70">New tab</text>
          <text x="138" y="112">History</text>
          <text x="138" y="154">Downloads</text>
          <text x="138" y="196">Bookmarks</text>
          <!-- the row that matters -->
          <rect x="122" y="216" width="176" height="46" rx="8" fill="#F0B429" opacity="0.20"/>
          <text x="138" y="246" font-size="15" font-weight="700" fill="#FFFFFF">Add to Home screen</text>
          <text x="138" y="298">Desktop site</text>
          <text x="138" y="340">Settings</text>
          <text x="138" y="382" fill="#9AA0A6">Help &#38; feedback</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================ STEP 3 ============================ -->
  <g transform="translate(744 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">3</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Name it, then Add</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Confirm once more if Android asks</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="36" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="22" fill="#111827"/>
      <g clip-path="url(#ascreen)">
        <rect x="14" y="14" width="292" height="584" fill="#111827" opacity="0.5"/>
        <rect x="14" y="14" width="292" height="584" fill="#0A0C12" opacity="0.55"/>

        <rect x="40" y="200" width="240" height="212" rx="16" fill="#292A2D"/>
        <text x="64" y="246" font-size="18" font-weight="700" fill="#FFFFFF">Add to Home screen</text>

        <rect x="64" y="268" width="52" height="52" rx="12" fill="#166534"/>
        <text x="90" y="302" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">CK</text>

        <rect x="130" y="278" width="128" height="32" rx="6" fill="#202124"/>
        <text x="142" y="300" font-size="14" font-weight="600" fill="#FFFFFF">Specialist Schedule</text>

        <text x="200" y="376" text-anchor="end" font-size="15" font-weight="700" fill="#8AB4F8">Cancel</text>
        <rect x="228" y="356" width="48" height="28" rx="7" fill="#8AB4F8"/>
        <text x="252" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">Add</text>
      </g>
      <use href="#aring" x="252" y="370"/>
    </g>
  </g>

  <!-- ============================ STEP 4 ============================ -->
  <g transform="translate(1100 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">4</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">It lives on your phone</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">One tap from now on — no searching</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="36" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="22" fill="#1F3A2E"/>
      <g clip-path="url(#ascreen)">
        <rect x="14" y="14" width="292" height="584" fill="#1F3A2E"/>
        <text x="160" y="58" text-anchor="middle" font-size="15" fill="#D1FAE5">9:41</text>

        <g>
          <rect x="44" y="110" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="131" y="110" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="218" y="110" width="58" height="58" rx="16" fill="#374151"/>

          <rect x="44" y="206" width="58" height="58" rx="16" fill="#166534"/>
          <text x="73" y="243" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">CK</text>
          <text x="73" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Specialist</text>
          <text x="73" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Schedule</text>

          <rect x="131" y="206" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="218" y="206" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="44" y="330" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="131" y="330" width="58" height="58" rx="16" fill="#374151"/>
          <rect x="218" y="330" width="58" height="58" rx="16" fill="#374151"/>
        </g>

        <rect x="44" y="506" width="232" height="72" rx="20" fill="#0A0C12" opacity="0.55"/>
      </g>
      <use href="#aring" x="73" y="235"/>
    </g>
  </g>
</svg>
