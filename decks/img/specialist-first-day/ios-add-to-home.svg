<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1452 792" width="1452" height="792" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>iPhone: add the specialist schedule to the Home Screen in four taps</title>

  <defs>
    <!-- Phone screen clip, reused by every panel -->
    <clipPath id="screen"><rect x="14" y="14" width="292" height="584" rx="30"/></clipPath>

    <!-- iOS share glyph: rounded box with an arrow rising out of it -->
    <g id="share">
      <path d="M4 13 v11 a3 3 0 0 0 3 3 h16 a3 3 0 0 0 3 -3 v-11" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M15 20 v-17" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M8.5 9.5 L15 3 L21.5 9.5" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Attention ring drawn around whatever the step wants you to touch -->
    <g id="ring">
      <circle r="34" fill="none" stroke="#F0B429" stroke-width="5"/>
      <circle r="34" fill="#F0B429" opacity="0.14"/>
    </g>
  </defs>

  <rect width="1452" height="792" fill="#FFFFFF"/>

  <!-- ============================ STEP 1 ============================ -->
  <g transform="translate(32 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Open it in Safari</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Tap the share button at the bottom</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="44" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="30" fill="#111827"/>
      <g clip-path="url(#screen)">
        <!-- page content -->
        <rect x="14" y="14" width="292" height="52" fill="#0A0C12"/>
        <text x="160" y="47" text-anchor="middle" font-size="15" fill="#9CA3AF">coachkenny.org</text>
        <text x="160" y="128" text-anchor="middle" font-size="30" font-weight="800"><tspan fill="#FFFFFF">COACH</tspan><tspan fill="#38BDF8">KENNY</tspan></text>
        <g fill="#1C222C">
          <rect x="38" y="166" width="244" height="88" rx="14"/>
          <rect x="38" y="268" width="244" height="88" rx="14"/>
          <rect x="38" y="370" width="244" height="88" rx="14"/>
        </g>
        <g text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">
          <text x="160" y="218">ATHLETICS OS</text>
          <text x="160" y="320">PE GAMES</text>
          <text x="160" y="422">SPECIALIST CALENDAR</text>
        </g>
        <!-- Safari bottom toolbar -->
        <rect x="14" y="524" width="292" height="74" fill="#1C1C1E"/>
        <g stroke="#8E8E93" stroke-width="2.6" fill="none" stroke-linecap="round">
          <path d="M52 561 l-11 -11 l11 -11"/>
          <path d="M104 539 l11 11 l-11 11"/>
        </g>
        <g transform="translate(145 536)"><use href="#share"/></g>
        <g stroke="#8E8E93" stroke-width="2.6" fill="none">
          <rect x="205" y="539" width="22" height="22" rx="4"/>
          <rect x="262" y="539" width="22" height="22" rx="4"/>
          <rect x="268" y="545" width="22" height="22" rx="4" fill="#1C1C1E"/>
        </g>
      </g>
      <use href="#ring" x="160" y="550"/>
    </g>
  </g>

  <!-- ============================ STEP 2 ============================ -->
  <g transform="translate(388 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Scroll the share sheet</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Find <tspan font-weight="700" fill="#0A0C12">Add to Home Screen</tspan></text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="44" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="30" fill="#111827"/>
      <g clip-path="url(#screen)">
        <rect x="14" y="14" width="292" height="584" fill="#111827"/>
        <!-- share sheet panel -->
        <rect x="14" y="150" width="292" height="448" rx="26" fill="#2C2C2E"/>
        <rect x="142" y="166" width="36" height="5" rx="2.5" fill="#6B7280"/>
        <rect x="34" y="192" width="252" height="58" rx="12" fill="#3A3A3C"/>
        <text x="50" y="217" font-size="15" font-weight="700" fill="#FFFFFF">Coach Kenny</text>
        <text x="50" y="238" font-size="13" fill="#9CA3AF">coachkenny.org</text>

        <g font-size="16" fill="#FFFFFF">
          <rect x="34" y="266" width="252" height="1" fill="#48484A"/>
          <text x="50" y="298">Copy</text>
          <rect x="34" y="318" width="252" height="1" fill="#48484A"/>
          <text x="50" y="350">Add to Reading List</text>
          <rect x="34" y="370" width="252" height="1" fill="#48484A"/>
          <text x="50" y="402">Add Bookmark</text>
          <rect x="34" y="422" width="252" height="1" fill="#48484A"/>
          <!-- the row that matters -->
          <rect x="26" y="432" width="268" height="56" rx="12" fill="#F0B429" opacity="0.18"/>
          <text x="50" y="466" font-size="17" font-weight="700" fill="#FFFFFF">Add to Home Screen</text>
          <g transform="translate(252 448)" stroke="#FFFFFF" stroke-width="2.2" fill="none">
            <rect x="0" y="0" width="20" height="20" rx="5"/>
            <path d="M10 5 v10 M5 10 h10" stroke-linecap="round"/>
          </g>
          <rect x="34" y="498" width="252" height="1" fill="#48484A"/>
          <text x="50" y="530" fill="#9CA3AF">Markup</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================ STEP 3 ============================ -->
  <g transform="translate(744 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">3</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">Name it, then Add</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">Short names fit better under the icon</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="44" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="30" fill="#111827"/>
      <g clip-path="url(#screen)">
        <rect x="14" y="14" width="292" height="584" fill="#111827"/>
        <rect x="14" y="150" width="292" height="448" rx="26" fill="#2C2C2E"/>

        <text x="34" y="197" font-size="16" font-weight="700" fill="#FFFFFF">Add to Home Screen</text>
        <rect x="234" y="176" width="56" height="30" rx="8" fill="#0A84FF"/>
        <text x="262" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Add</text>

        <rect x="34" y="230" width="252" height="76" rx="12" fill="#3A3A3C"/>
        <rect x="48" y="244" width="48" height="48" rx="11" fill="#166534"/>
        <text x="72" y="275" text-anchor="middle" font-size="19" font-weight="800" fill="#FFFFFF">CK</text>
        <rect x="110" y="252" width="160" height="32" rx="7" fill="#1C1C1E"/>
        <text x="122" y="274" font-size="15" font-weight="600" fill="#FFFFFF">Specialist Schedule</text>

        <text x="50" y="336" font-size="13" fill="#9CA3AF">coachkenny.org</text>
        <text x="50" y="374" font-size="14" fill="#8E8E93">An icon will be added to your</text>
        <text x="50" y="396" font-size="14" fill="#8E8E93">Home Screen so you can quickly</text>
        <text x="50" y="418" font-size="14" fill="#8E8E93">get to this website.</text>
      </g>
      <use href="#ring" x="262" y="191"/>
    </g>
  </g>

  <!-- ============================ STEP 4 ============================ -->
  <g transform="translate(1100 32)">
    <circle cx="18" cy="18" r="18" fill="#166534"/>
    <text x="18" y="25" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">4</text>
    <text x="50" y="26" font-size="24" font-weight="700" fill="#0A0C12">It lives on your phone</text>
    <text x="0" y="60" font-size="19" fill="#4B5563">One tap from now on — no searching</text>

    <g transform="translate(0 80)">
      <rect x="0" y="0" width="320" height="612" rx="44" fill="#0A0C12"/>
      <rect x="14" y="14" width="292" height="584" rx="30" fill="#1F3A2E"/>
      <g clip-path="url(#screen)">
        <rect x="14" y="14" width="292" height="584" fill="#1F3A2E"/>
        <text x="160" y="60" text-anchor="middle" font-size="15" fill="#D1FAE5">9:41</text>

        <!-- home screen icon grid -->
        <g>
          <rect x="44" y="110" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="131" y="110" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="218" y="110" width="58" height="58" rx="14" fill="#374151"/>

          <!-- the new shortcut -->
          <rect x="44" y="206" width="58" height="58" rx="14" fill="#166534"/>
          <text x="73" y="243" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">CK</text>
          <text x="73" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Specialist</text>
          <text x="73" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Schedule</text>

          <rect x="131" y="206" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="218" y="206" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="44" y="330" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="131" y="330" width="58" height="58" rx="14" fill="#374151"/>
          <rect x="218" y="330" width="58" height="58" rx="14" fill="#374151"/>
        </g>

        <rect x="44" y="500" width="232" height="80" rx="24" fill="#0A0C12" opacity="0.55"/>
      </g>
      <use href="#ring" x="73" y="235"/>
    </g>
  </g>
</svg>
