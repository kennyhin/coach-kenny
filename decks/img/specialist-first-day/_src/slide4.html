<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1452px;height:792px;background:#fff;
       font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
       display:grid;grid-template-columns:1fr 1fr 1fr;gap:44px;padding:32px}
  .n{width:36px;height:36px;border-radius:99px;background:#166534;color:#fff;
     display:grid;place-items:center;font-size:21px;font-weight:700}
  .hd{display:flex;align-items:center;gap:14px}
  h3{font-size:24px;font-weight:700;color:#0A0C12}
  p.sub{font-size:19px;color:#4B5563;margin:10px 0 18px}
  .phone{width:320px;border-radius:44px;background:#0A0C12;padding:14px;
         box-shadow:0 6px 24px rgba(0,0,0,.14)}
  .phone img{width:292px;height:560px;object-fit:cover;object-position:top;
             border-radius:30px;display:block}
  .zoom{border:3px solid #F0B429;border-radius:16px;overflow:hidden;
        box-shadow:0 6px 24px rgba(0,0,0,.16);background:#0A0C12}
  .zoom img{width:100%;display:block}
  .cap{margin-top:20px;font-size:19px;line-height:1.5;color:#0A0C12}
  .cap b{font-weight:700}
</style></head><body>
  <section>
    <div class="hd"><div class="n">1</div><h3>Start at the hub</h3></div>
    <p class="sub">coachkenny.org &mdash; the one address to remember</p>
    <div class="phone"><img src="ck-phone.png"></div>
  </section>
  <section>
    <div class="hd"><div class="n">2</div><h3>Scroll to Rotations</h3></div>
    <p class="sub">It sits below Decks in the card list</p>
    <div class="phone"><img src="ck-scrolled.png"></div>
  </section>
  <section>
    <div class="hd"><div class="n">3</div><h3>Tap Specialist Calendar</h3></div>
    <p class="sub">That card opens the rotation schedule</p>
    <div class="zoom"><img src="card-rotations.png"></div>
    <p class="cap">Opens the live Specialist Rotation Board on coachkenny.org — no separate school Site login.</p>
  </section>
</body></html>
