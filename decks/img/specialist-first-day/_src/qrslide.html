<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1452px;height:792px;background:#fff;display:flex;align-items:center;
       gap:72px;padding:56px 72px;
       font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
  img{width:660px;height:660px;display:block}
  .url{font-size:76px;font-weight:800;letter-spacing:-.02em;color:#0A0C12;line-height:1.05}
  .url span{color:#166534}
  .sub{margin-top:26px;font-size:30px;line-height:1.4;color:#4B5563}
  .rule{width:120px;height:8px;background:#F0B429;border-radius:4px;margin:34px 0}
  .fall{font-size:26px;color:#166534;font-weight:700}
</style></head><body>
  <img src="qr.png" alt="QR code for coachkenny.org">
  <div>
    <p class="url">coachkenny<span>.org</span></p>
    <div class="rule"></div>
    <p class="sub">Point your camera at the code &mdash; or just type the address.</p>
    <p class="sub fall">Same page either way.</p>
  </div>
</body></html>
